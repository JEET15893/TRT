name: Build TRT APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract TRT project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q TRT_Native_Widget_v10_green_window_countdown.zip -d extracted
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: extracted
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TRT-native-widget-apk
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
